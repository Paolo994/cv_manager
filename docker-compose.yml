services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-cvmanager}
      POSTGRES_USER: ${DB_USER:-cvmanager}
      # definita nel file .env (non versionato): vedi .env.example
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      org.springframework.boot.service-connection: postgres

volumes:
  pgdata:
