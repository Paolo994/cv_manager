spring:
  application:
    name: cv-manager

  # Variabili locali (DB_PASSWORD, ANTHROPIC_API_KEY, ...) dal file .env non versionato:
  # ./.env se l'app parte dalla root, ../.env se parte da backend/ (mvn spring-boot:run)
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

  # In locale Spring Boot avvia docker-compose.yml (Postgres su localhost:5433)
  # e sovrascrive queste credenziali; in produzione arrivano da variabili d'ambiente.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cvmanager}
    username: ${DB_USER:cvmanager}
    password: ${DB_PASSWORD:}
  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-only

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Le tabelle di Spring Session sono create da Flyway (V2)
  session:
    jdbc:
      initialize-schema: never

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  servlet:
    session:
      timeout: 30m

app:
  session:
    # true in produzione (HTTPS); attributi del cookie in SessionConfig
    cookie-secure: ${COOKIE_SECURE:false}
  storage:
    local-dir: ${STORAGE_DIR:./data/uploads}
  # Modello e limiti per agente: qualità e costi si regolano qui, senza toccare il codice
  agents:
    cv-parser:
      model: claude-sonnet-5-5
      max-tokens: 8000
    cv-reviewer:
      model: claude-sonnet-5-5
      max-tokens: 6000
    job-analyzer:
      model: claude-haiku-5-5
      max-tokens: 3000
    cv-tailor:
      model: claude-sonnet-5-5
      max-tokens: 8000
    cover-letter-writer:
      model: claude-opus-5-5
      max-tokens: 4000
    critic:
      model: claude-sonnet-5-5
      max-tokens: 4000

management:
  endpoints:
    web:
      exposure:
        include: health
